[project]
name = "pokeagent"
version = "0.1.0"
description = "An autonomous, self-improving agent that plays Game Boy games through the local Claude CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.23",
    "libretro.py==0.12.0",
    "mcp>=2.3,<3",
    "pillow>=11",
    "ruff>=0.12",
]

[project.scripts]
pokeagent = "pokeagent.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeagent"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
