name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install bubblewrap and 7-Zip, allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap p7zip-full
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pokeagent/cores
          key: cores-${{ hashFiles('src/pokeagent/emulator/cores.py') }}
      - run: uv sync --frozen
      - run: scripts/check.sh
